    compensates_with: "Ha ejercido funciones equivalentes: equipo, budget, arquitectura, estrategia"
  - gap: "Piden AWS/GCP certificación específica"
    compensates_with: "Azure profundo + experiencia multi-cloud demostrable, curva de aprendizaje mínima"
  - gap: "Piden experiencia en startup (nunca ha trabajado en una)"
    compensates_with: "Mentalidad emprendedora demostrada con iniciativas propias dentro de Inditex"
  - gap: "Piden más años en dirección pura (5+ años managing)"
    compensates_with: "4+ años liderando equipos en Inditex, con hiring, presupuesto y stakeholder management real"
  - gap: "Piden MLOps o Data Science profundo"
    compensates_with: "Ha supervisado y entregado proyectos de ML/LLM en producción, aunque no es el científico de datos"
