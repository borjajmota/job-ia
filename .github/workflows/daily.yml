name: Job Agent - Diario

on:
  schedule:
    - cron: "0 7 * * 1-5"      # L-V 09:00 Madrid (Actions se retrasa, es normal)
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar otra corrida aunque ya haya habido una sin bloqueo hoy"
        type: boolean
        default: false

jobs:
  run:
    # CRITICO: runner self-hosted. En ubuntu-latest la IP es de datacenter y
    # LinkedIn la bloquea: es exactamente lo que mato a la v1 de este proyecto.
    runs-on: [self-hosted, windows, jobia]
    # 30->60: sin tope en L3/enrich_details (2026-09-16), el volumen real
    # depende de cuanto deje pasar L2 cada dia, no de un top_k fijo de 18.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Instalar
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e .

      - name: Ejecutar
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          JOBIA_DB_PATH:      ${{ runner.workspace }}/jobia-state/jobia.db
          JOBIA_LLM_MODEL:    gemini-2.5-flash
        run: |
          if ('${{ github.event.inputs.force }}' -eq 'true') {
            .venv\Scripts\jobia run --force
          } else {
            .venv\Scripts\jobia run
          }

      # El estado vive FUERA del repo, en disco del runner. Nada de commitear
      # la base de datos en cada corrida.
