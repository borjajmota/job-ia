name: Job Agent — Daily Run

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job agent
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python job_agent.py

      - name: Commit updated state files
        run: |
          git config user.name  "job-agent-bot"
          git config user.email "bot@noreply.github.com"
          
          # 1. Añadimos los archivos modificados
          git add seen_jobs.txt application_queue.json logs/ || true
          
          # 2. Solo si hay cambios, hacemos commit y push
          if ! git diff --staged --quiet; then
            git commit -m "Update state: $(date +'%Y-%m-%d %H:%M')"
            
            # 3. Pull rebase para evitar conflictos si el repo cambió
            git pull --rebase origin main
            
            # 4. Push final
            git push
          else
            echo "No hay cambios en los archivos de estado. Nada que hacer."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
