# ------------------------------------------------------------
# L2 — FILTROS DUROS (deterministas, sin LLM)
# ------------------------------------------------------------
hard_filters:
  # Descarte inmediato. Estos no llegan ni a embeddings.
  disqualifiers:
    - "Rol 100% IC de coding sin liderazgo ni arquitectura"
    - "Data Engineer junior o mid"
    - "BI puro sin estrategia ni equipo"
    - "Data Scientist / Machine Learning Scientist puro (perfil modelador)"
    - "Ventas sin componente técnico"
    - "Soporte técnico o helpdesk"
    - "Administración pública"
    - "Reubicación fuera de España como requisito"
    - "Sector sin componente de datos relevante"

  # Señal roja pero NO descarte: baja el score, no lo elimina.
  yellow_flags:
    - "Proceso con live coding challenge de produccion"   # ver known_gaps
    - "Puesto que reporta a 3+ niveles por encima (CDAIO, CTO de grupo)"
    - "Viajes > 30%"

  sectors_preferred: [Retail, eCommerce, Fintech, Banca, Tecnología, SaaS,
                      "Consultoría estratégica", Moda, Lujo, Movilidad, Logística,
                      "Salud/Seguros con fuerte componente de datos"]
  sectors_avoid: ["Administración pública", "Hostelería sin tecnología",
                  "Manufactura sin transformación digital"]

  work_mode:
