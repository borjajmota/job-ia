# ------------------------------------------------------------
# L4 — GUÍA PARA EL JUEZ LLM
# ------------------------------------------------------------
scoring_guidance:
  calibration: |
    Puntúa contra el nivel REAL de Borja, no contra su ambición. Un puesto
    2 niveles por encima (CDAIO, CTO de grupo, director de 80-150 personas)
    NO es un 90 porque el dominio encaje: es un 55-60. Ser realista aquí vale
    más que ser generoso, porque cada falso positivo le cuesta una tarde.

  bonus_signals:
    - "Construir producto o equipo desde cero"
    - "Autonomía real, sin dependencias de una plataforma global"
    - "Equipo propio a cargo"
    - "Mezcla explícita de liderazgo y profundidad técnica"
    - "Scale-up con producto propio, o marca reconocida"
    - "IA aplicada en producción, no investigación"

  penalty_signals:
    - "Fuera de Madrid sin que la empresa sea de primer nivel, o sin modelo híbrido"
    - "Gobierno corporativo puro, comités y políticas sin ejecución"
    - "Ownership financiero de área (OPEX/CAPEX/cash-out) como requisito central"
    - "Exigencia de 15+ años o de reporte a comité de dirección de grupo"
    - "Data science puro: modelado, estadística, research"
    - "IC sin equipo y con salario probablemente inferior al actual"

  known_gaps:
    - gap: "FinOps y defensa presupuestaria corporativa ante Finanzas"
      note: "Tiene gestión de presupuesto de programa (1,5M€), no ownership financiero de un área."
    - gap: "Exposición documentada a comité de dirección"
      note: "No evidenciada en CV. Penaliza en procesos C-level."
    - gap: "Código de producción propio en los últimos 5 años"
      note: "Construye con Claude Code, que no es lo mismo. Los procesos con live
             challenge de dos horas filtran exactamente esto. Marcar señal roja."
    - gap: "Antigüedad corta en el puesto actual"
      note: "Desde marzo de 2026. Exige narrativa en procesos senior."

  compensable_gaps:
    - gap: "Sector no cubierto"
      with: "Experiencia cross-sector: retail global en Inditex, banca en BBVA y ING"
    - gap: "El título no coincide exactamente"
      with: "Ha ejercido las funciones: equipo, presupuesto, arquitectura y estrategia"
    - gap: "Piden certificación AWS o GCP"
      with: "Azure profundo, GCP en el rol actual, multi-cloud demostrable"
    - gap: "Piden experiencia en startup"
      with: "Iniciativas propias levantadas dentro de corporaciones, de cero a producción"
    - gap: "Piden MLOps o data science profundo"
      with: "Ha entregado ML y LLMs en producción como arquitecto y responsable"

