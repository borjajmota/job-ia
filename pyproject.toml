[project]
name = "jobia"
version = "0.2.0"
description = "Agente de busqueda de empleo en LinkedIn con LangGraph"
requires-python = ">=3.11"
dependencies = [
  "python-jobspy>=1.1.80",
  "curl_cffi>=0.7.0",
  "beautifulsoup4>=4.12",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0",
  "sentence-transformers>=3.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "groq>=0.11",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Solo para el dashboard local (src/jobia/dashboard/): ni daily.yml ni
# ci.yml lo tocan, y streamlit arrastra pandas/pyarrow/altair -- meterlo en
# dependencies obligaba a instalarlo tambien en el runner de produccion y
# en cada corrida de CI, sin usarlo nunca ahi.
dashboard = ["streamlit>=1.38", "ruamel.yaml>=0.18"]

[project.scripts]
jobia = "jobia.cli:main"

[tool.ruff]
line-length = 100
# v1_archivo/ es la v1 anterior, guardada solo de referencia -- no se
# mantiene ni se lintea.
extend-exclude = ["v1_archivo"]

[tool.ruff.lint]
ignore = [
  "BLE001",  # except Exception amplio: deliberado en los bordes con Groq/SMTP/LinkedIn,
             # servicios externos que pueden fallar de formas que no vale la pena enumerar.
  "DTZ005",  # datetime.now() sin tz en scripts/gate0_linkedin.py (script de validacion
             # historica, fuera de alcance tocarlo por esto).
  "FURB162", # UP017 y FURB162: estilo, no correctitud -- no forman parte de lo pedido hoy.
  "UP017",
]
